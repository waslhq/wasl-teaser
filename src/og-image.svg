<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="WASL — the governed runtime for APIs and AI">
  <defs>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full square backdrop; the OG frame is the centered 1200x630 band (y 285..915) -->
  <rect width="1200" height="1200" fill="#070b13"/>

  <!-- content composed for the centered 1200x630 band -->
  <g transform="translate(0,285)">
    <circle cx="120" cy="60" r="420" fill="url(#orbA)"/>
    <circle cx="1140" cy="120" r="380" fill="url(#orbB)"/>

    <!-- brand lockup -->
    <g transform="translate(80,60)">
      <g transform="scale(0.6)">
        <rect width="90" height="90" rx="24" fill="url(#wm)"/>
        <g fill="none" stroke="#ffffff" stroke-linecap="round" transform="scale(0.75)">
          <path d="M16,28 C42,28 46,56 68,56" stroke-width="8" opacity="0.95"/>
          <path d="M16,44 C42,44 50,56 68,56" stroke-width="8" opacity="0.78"/>
          <path d="M16,68 C42,68 50,56 68,56" stroke-width="8" opacity="0.78"/>
          <path d="M16,84 C42,84 46,56 68,56" stroke-width="8" opacity="0.95"/>
          <path d="M68,56 L96,56" stroke-width="12"/>
        </g>
        <circle cx="51" cy="42" r="8.2" fill="#ffffff"/>
        <circle cx="51" cy="42" r="3.7" fill="url(#wm)"/>
      </g>
      <text x="70" y="38" font-family="Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="3" fill="#f8fafc">WASL</text>
    </g>

    <!-- headline -->
    <text x="80" y="270" font-family="Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" fill="#f8fafc" letter-spacing="-1">The governed runtime</text>
    <text x="80" y="346" font-family="Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1">
      <tspan fill="#f8fafc">for </tspan><tspan fill="url(#txt)">APIs and AI.</tspan>
    </text>

    <!-- subline -->
    <text x="82" y="410" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="500" fill="#aab6c6">API · AI · Event · Worker · MCP — one governed plane.</text>

    <!-- GA badge -->
    <g transform="translate(80,470)">
      <rect width="450" height="54" rx="27" fill="#0f172a" stroke="#334155"/>
      <circle cx="34" cy="27" r="6" fill="#2DD4BF"/>
      <text x="54" y="35" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1" fill="#f8fafc">GENERAL AVAILABILITY · OCTOBER 2026</text>
    </g>
  </g>
</svg>
